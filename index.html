<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A minimal greeting that changes automatically according to your device's local time.">
  <title>Time Greeting — kayralrics.net</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #000000;
      --red: #ff1e1e;
      --muted: #a3a3a3;
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    html { min-width: 320px; min-height: 100%; background: var(--background); }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background: var(--background);
      color: var(--red);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 5rem;
      text-align: center;
    }

    #greeting {
      width: 100%;
      margin: 0;
      color: var(--red);
      font-size: clamp(3.2rem, 14vw, 13rem);
      font-weight: 900;
      line-height: 0.98;
      letter-spacing: -0.075em;
      overflow-wrap: anywhere;
      text-wrap: balance;
      transition: opacity 180ms ease;
    }

    #greeting.changing { opacity: 0.45; }

    .details {
      display: grid;
      justify-items: center;
      gap: 0.65rem;
      margin-top: clamp(2rem, 7vh, 4rem);
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.5;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    #clock {
      color: var(--red);
      font-size: clamp(1rem, 2.2vw, 1.35rem);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.12em;
    }

    footer {
      position: fixed;
      right: 1rem;
      bottom: max(1rem, env(safe-area-inset-bottom));
      left: 1rem;
      text-align: center;
      color: #777777;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
    }

    footer a {
      color: var(--red);
      text-decoration: none;
    }

    footer a:hover,
    footer a:focus-visible { text-decoration: underline; }

    footer a:focus-visible { outline: 2px solid var(--red); outline-offset: 4px; }

    @media (max-width: 480px) {
      #greeting { font-size: clamp(2.8rem, 13vw, 5rem); letter-spacing: -0.06em; }
      .details { letter-spacing: 0.1em; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <h1 id="greeting" aria-live="polite">Good Morning</h1>
    <div class="details">
      <time id="clock" aria-label="Your current local time">--:--:--</time>
    </div>
  </main>

  <footer>Created by <a href="https://kayralrics.net" target="_blank" rel="noopener noreferrer">kayralrics.net</a></footer>

  <script>
    (() => {
      'use strict';

      const greetingElement = document.getElementById('greeting');
      const clockElement = document.getElementById('clock');
      let lastGreeting = '';
      let timerId = null;

      // Uses the browser's local time (Date#getHours), not a fixed time zone.
      // Good Night is included for the nighttime period, although it is most
      // commonly used when saying goodbye or going to bed.
      function getGreeting(date) {
        const hour = date.getHours();
        if (hour >= 5 && hour < 12) return { text: 'Good Morning' };
        if (hour >= 12 && hour < 17) return { text: 'Good Afternoon' };
        if (hour >= 17 && hour < 21) return { text: 'Good Evening' };
        return { text: 'Good Night' };
      }

      function update() {
        const now = new Date();
        const current = getGreeting(now);
        const pad = value => String(value).padStart(2, '0');

        clockElement.dateTime = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        clockElement.textContent = new Intl.DateTimeFormat(undefined, {
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
        }).format(now);

        if (current.text !== lastGreeting) {
          greetingElement.classList.add('changing');
          greetingElement.textContent = current.text;
          lastGreeting = current.text;
          requestAnimationFrame(() => greetingElement.classList.remove('changing'));
        }
      }

      function scheduleNextUpdate() {
        if (timerId !== null) window.clearTimeout(timerId);
        // Align the refresh to the next second for a steady, accurate clock.
        timerId = window.setTimeout(() => {
          update();
          scheduleNextUpdate();
        }, 1000 - (Date.now() % 1000) + 10);
      }

      function start() {
        if (timerId !== null) window.clearTimeout(timerId);
        update();
        scheduleNextUpdate();
      }

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') start();
        else if (timerId !== null) {
          window.clearTimeout(timerId);
          timerId = null;
        }
      });

      window.addEventListener('focus', start);
      window.addEventListener('pageshow', start);
      start();
    })();
  </script>
</body>
</html>
